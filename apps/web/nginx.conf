server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Exceeds FastAPI's 50MB default upload limit so FastAPI returns 413 PAYLOAD_TOO_LARGE cleanly
    client_max_body_size 55m;

    # Dedicated SSE reverse proxy (no buffering, HTTP/1.1 persistent connection, long read timeout)
    location /api/v1/events/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Backend REST API reverse proxy
    location /api/v1/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_read_timeout 120s;
    }

    # Immutable hashed Vite bundle assets
    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback so React Router deep links (e.g. /billing/checkout/:checkoutId) return 200 text/html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
